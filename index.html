<script>
let properties = JSON.parse(localStorage.getItem("fileinoProperties") || "[]");

function saveProperties() {
    localStorage.setItem("fileinoProperties", JSON.stringify(properties));
}

function showRegister() {
    document.getElementById("registerBox").classList.remove("hidden");
    document.getElementById("registerBox").scrollIntoView({behavior:"smooth"});
}

function hideRegister() {
    document.getElementById("registerBox").classList.add("hidden");
}

function addProperty() {
    const type = document.getElementById("type").value;
    const area = document.getElementById("area").value;
    const price = document.getElementById("price").value;
    const rooms = document.getElementById("rooms").value;
    const location = document.getElementById("location").value;
    const floor = document.getElementById("floor").value;
    const phone = document.getElementById("phone").value;
    const description = document.getElementById("description").value;

    if (!type || !area || !price || !location) {
        alert("نوع ملک، متراژ، قیمت و منطقه را وارد کن.");
        return;
    }

    const property = {
        id: Date.now(),
        type,
        area,
        price,
        rooms,
        location,
        floor,
        phone,
        description,
        parking: document.getElementById("parking").checked,
        elevator: document.getElementById("elevator").checked,
        storage: document.getElementById("storage").checked
    };

    properties.push(property);
    saveProperties();

    renderProperties();
    clearForm();

    alert("✅ فایل با موفقیت ذخیره شد.");
}

function clearForm() {
    document.getElementById("type").value = "";
    document.getElementById("area").value = "";
    document.getElementById("price").value = "";
    document.getElementById("rooms").value = "";
    document.getElementById("location").value = "";
    document.getElementById("floor").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("description").value = "";

    document.getElementById("parking").checked = false;
    document.getElementById("elevator").checked = false;
    document.getElementById("storage").checked = false;
}

function renderProperties(list = properties) {
    const box = document.getElementById("propertyList");

    if (!list.length) {
        box.innerHTML = '<div class="empty">هنوز فایلی ثبت نشده است.</div>';
        return;
    }

    box.innerHTML = list.map(p => `
        <div class="property">
            <h3>${p.type} در ${p.location}</h3>

            <p>💰 <span class="price">${p.price} میلیارد تومان</span></p>

            <p>
                📐 ${p.area} متر
                &nbsp;&nbsp;
                🛏️ ${p.rooms || "-"} خواب
                &nbsp;&nbsp;
                🏢 طبقه ${p.floor || "-"}
            </p>

            <p>
                ${p.parking ? "🚗 پارکینگ" : ""}
                ${p.elevator ? " | 🛗 آسانسور" : ""}
                ${p.storage ? " | 📦 انباری" : ""}
            </p>

            <p>📞 ${p.phone || "ثبت نشده"}</p>

            <p>${p.description || ""}</p>

            <button class="btn secondary" onclick="deleteProperty(${p.id})">
                🗑 حذف فایل
            </button>
        </div>
    `).join("");
}

function deleteProperty(id) {
    properties = properties.filter(p => p.id !== id);
    saveProperties();
    renderProperties();
}

function searchProperties() {
    const min = parseFloat(document.getElementById("minPrice").value);
    const max = parseFloat(document.getElementById("maxPrice").value);
    const results = document.getElementById("results");

    if (isNaN(min) || isNaN(max)) {
        results.innerHTML =
            '<div class="empty">حداقل و حداکثر قیمت را وارد کنید.</div>';
        return;
    }

    const matches = properties.filter(p =>
        Number(p.price) >= min && Number(p.price) <= max
    );

    if (!matches.length) {
        results.innerHTML =
            '<div class="empty">در این بازه قیمتی فایلی پیدا نشد.</div>';
        return;
    }

    results.innerHTML = "<h3>فایل‌های مناسب مشتری:</h3>";

    matches.forEach(p => {
        results.innerHTML += `
            <div class="property">
                <h3>${p.type} در ${p.location}</h3>
                <p>💰 <span class="price">${p.price} میلیارد تومان</span></p>
                <p>📐 ${p.area} متر &nbsp;&nbsp; 🛏️ ${p.rooms || "-"} خواب</p>
                <p>📞 ${p.phone || "ثبت نشده"}</p>
            </div>
        `;
    });
}

function showFiles() {
    document.getElementById("filesBox").scrollIntoView({behavior:"smooth"});
    renderProperties();
}

renderProperties();
</script>
