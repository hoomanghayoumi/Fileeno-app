
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fileeno | املاک رهام</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f3;color:#17251d;font-family:Tahoma,Arial,sans-serif;line-height:1.8}
header{background:#123c2d;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:750px;margin:auto;padding:14px}
.logo{font-size:25px;font-weight:bold}
.sub{font-size:12px;opacity:.8}
.box{background:white;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000009}
h2{font-size:17px;margin:0 0 12px;color:#123c2d}
label{display:block;font-size:12px;font-weight:bold;margin:9px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0da;border-radius:9px;font:inherit;font-size:14px;background:white}
textarea{min-height:75px}
button{border:0;border-radius:9px;padding:11px 14px;font:inherit;font-size:13px;cursor:pointer}
.primary{background:#123c2d;color:white}
.light{background:#eaf0eb;color:#123c2d}
.red{background:#fbe9e9;color:#a22}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.hidden{display:none!important}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#eaf0eb;color:#123c2d}
.tab.active{background:#123c2d;color:white}
.card{border:1px solid #e0e7e1;border-radius:13px;padding:13px;margin:10px 0}
.card h3{font-size:15px;margin:0}
.muted{font-size:12px;color:#6d7a71}
.price{font-weight:bold;color:#087347;margin-top:5px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.notice{padding:10px;border-radius:9px;background:#eef5ef;font-size:13px;margin:10px 0}
.private{background:#fff8e9;padding:10px;border-radius:10px;margin-top:8px;font-size:12px}
#message{position:fixed;bottom:15px;left:12px;right:12px;max-width:500px;margin:auto;background:#173d2d;color:white;padding:12px;border-radius:10px;text-align:center;display:none;z-index:20}
@media(max-width:420px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="logo">Fileeno | فایلینو</div>
  <div class="sub">مدیریت هوشمند فایل‌های املاک رهام</div>
 </div>
</header>

<div class="wrap">
<section class="box" id="auth">
 <h2>ورود به فایلینو</h2>
 <label>ایمیل</label>
 <input id="email" type="email" placeholder="ایمیل حساب">
 <label>رمز عبور</label>
 <input id="password" type="password" placeholder="رمز عبور">
 <div class="row" style="margin-top:12px">
  <button class="primary" onclick="login()">ورود</button>
  <button class="light" onclick="signup()">ثبت‌نام</button>
 </div>
 <div class="muted" id="authInfo"></div>
</section>

<section id="application" class="hidden">
 <div class="box">
  <div class="row" style="align-items:center">
   <div><b>پنل مدیریت فایل‌ها</b><div class="muted" id="userEmail"></div></div>
   <button class="light" onclick="logout()">خروج</button>
  </div>
 </div>

 <div class="tabs">
  <button class="tab active" id="tabFiles" onclick="showTab('files')">فایل‌ها</button>
  <button class="tab" id="tabForm" onclick="showTab('form')">ثبت فایل</button>
  <button class="tab" id="tabCustomers" onclick="showTab('customers')">مشتریان</button>
 </div>

 <section id="filesSection" class="box">
  <h2>فایل‌های ثبت‌شده</h2>
  <input id="search" placeholder="جستجو در محله، نوع ملک، متراژ..." oninput="renderFiles()">
  <div class="row" style="margin-top:9px">
   <select id="filterCategory" onchange="renderFiles()">
    <option value="">همه دسته‌ها</option>
    <option>فروش آپارتمان</option>
    <option>رهن و اجاره</option>
    <option>کلنگی</option>
   </select>
   <button class="primary" onclick="newProperty()">+ ثبت فایل</button>
  </div>
  <div id="filesList"></div>
 </section>

 <section id="formSection" class="box hidden">
  <h2 id="formTitle">ثبت فایل جدید</h2>
  <input type="hidden" id="editId">
  <label>عنوان فایل</label>
  <input id="title" placeholder="مثلاً آپارتمان ۷۰ متری افسریه">
  <div class="grid">
   <div><label>دسته‌بندی</label>
    <select id="category">
     <option>فروش آپارتمان</option>
     <option>رهن و اجاره</option>
     <option>کلنگی</option>
    </select>
   </div>
   <div><label>نوع ملک</label>
    <select id="type">
     <option>آپارتمان</option><option>خانه</option><option>زمین</option>
     <option>ویلا</option><option>مغازه</option><option>دفتر کار</option>
    </select>
   </div>
   <div><label>محله</label><input id="areaName" placeholder="افسریه"></div>
   <div><label>متراژ</label><input id="meter" type="number"></div>
   <div><label>تعداد خواب</label><input id="rooms" type="number"></div>
   <div><label>طبقه</label><input id="floor" type="number"></div>
   <div><label>سال ساخت</label><input id="year" type="number"></div>
   <div><label>قیمت کل (تومان)</label><input id="price" inputmode="numeric"></div>
   <div><label>مبلغ رهن (تومان)</label><input id="deposit" inputmode="numeric"></div>
   <div><label>اجاره ماهانه (تومان)</label><input id="rent" inputmode="numeric"></div>
  </div>
  <label>امکانات</label>
  <input id="features" placeholder="پارکینگ، آسانسور، انباری، تراس...">
  <label>توضیحات</label>
  <textarea id="description" placeholder="توضیحات تکمیلی ملک"></textarea>
  <div class="private">
   <b>🔒 اطلاعات محرمانه مالک (در آگهی عمومی نمایش داده نمی‌شود)</b>
   <label>شماره تماس مالک</label>
   <input id="ownerPhone" inputmode="tel">
   <label>آدرس دقیق و پلاک</label>
   <input id="ownerAddress">
  </div>
  <div class="row" style="margin-top:14px">
   <button class="primary" id="saveButton" onclick="saveProperty()">ذخیره فایل</button>
   <button class="light" onclick="showTab('files')">انصراف</button>
  </div>
 </section>

 <section id="customersSection" class="box hidden">
  <h2>ثبت مشتری</h2>
  <input type="hidden" id="customerEditId">
  <label>نام مشتری</label><input id="customerName">
  <label>شماره تماس</label><input id="customerPhone" inputmode="tel">
  <label>نوع درخواست</label>
  <select id="customerType"><option>خرید</option><option>رهن و اجاره</option><option>فروش</option></select>
  <label>بودجه یا مبلغ موردنظر (تومان)</label><input id="customerBudget" inputmode="numeric">
  <label>محله موردنظر</label><input id="customerArea">
  <label>توضیحات</label><textarea id="customerDescription"></textarea>
  <button class="primary" style="margin-top:12px" onclick="saveCustomer()">ذخیره مشتری</button>
  <div id="customersList"></div>
 </section>
</section>
</div>

<div id="message"></div>

<script>
const SUPABASE_URL="https://dnodndhknsxbcfxockdg.supabase.co";
const SUPABASE_KEY="sb_publishable_TTFOVVtrWKVSSuW2dI90HA_yCC4u-e_";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let properties=[];
let customers=[];

function notify(text){
 const el=document.getElementById("message");
 el.textContent=text;el.style.display="block";
 setTimeout(()=>el.style.display="none",3000);
}
function val(id){return document.getElementById(id).value.trim()}
function setVal(id,value){document.getElementById(id).value=value??""}
function money(value){
 if(!value)return "—";
 return Number(value).toLocaleString("en-US")+" تومان";
}
function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
async function login(){
 const {data,error}=await db.auth.signInWithPassword({
  email:val("email"),password:val("password")
 });
 if(error){notify(error.message);return}
 currentUser=data.user;await startApp();
}
async function signup(){
 const email=val("email"),password=val("password");
 if(!email||password.length<6){notify("ایمیل و رمز حداقل ۶ کاراکتری وارد کن");return}
 const {data,error}=await db.auth.signUp({email,password});
 if(error){notify(error.message);return}
 if(data.session){currentUser=data.user;await startApp()}
 else{notify("ثبت‌نام انجام شد؛ ایمیلت را برای تأیید بررسی کن")}
}
async function logout(){
 await db.auth.signOut();currentUser=null;
 document.getElementById("application").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
}
async function startApp(){
 if(!currentUser)return;
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("application").classList.remove("hidden");
 document.getElementById("userEmail").textContent=currentUser.email||"";
 showTab("files");
 await loadProperties();await loadCustomers();
}
async function loadProperties(){
 const {data,error}=await db.from("fileeno_properties")
  .select("*").order("created_at",{ascending:false});
 if(error){notify("خطای دریافت فایل‌ها: "+error.message);return}
 properties=(data||[]).map(row=>({...row.data,id:row.id}));
 renderFiles();
}
async function saveProperty(){
 if(!currentUser)return;
 if(!val("title")){notify("عنوان فایل را وارد کن");return}
 const id=val("editId");
 const record={
  title:val("title"),category:val("category"),type:val("type"),
  areaName:val("areaName"),meter:val("meter"),rooms:val("rooms"),
  floor:val("floor"),year:val("year"),price:val("price"),
  deposit:val("deposit"),rent:val("rent"),features:val("features"),
  description:val("description"),ownerPhone:val("ownerPhone"),
  ownerAddress:val("ownerAddress"),updatedAt:new Date().toISOString()
 };
 let result;
 if(id){
  result=await db.from("fileeno_properties").update({data:record})
   .eq("id",id).select();
 }else{
  result=await db.from("fileeno_properties")
   .insert({user_id:currentUser.id,data:record}).select();
 }
 if(result.error){notify("ذخیره ناموفق: "+result.error.message);return}
 notify(id?"فایل ویرایش شد":"فایل ذخیره شد");
 clearPropertyForm();await loadProperties();showTab("files");
}
function clearPropertyForm(){
 ["editId","title","areaName","meter","rooms","floor","year","price",
 "deposit","rent","features","description","ownerPhone","ownerAddress"]
 .forEach(id=>setVal(id,""));
 setVal("category","فروش آپارتمان");setVal("type","آپارتمان");
 document.getElementById("formTitle").textContent="ثبت فایل جدید";
}
function newProperty(){clearPropertyForm();showTab("form")}
function editProperty(id){
 const p=properties.find(x=>x.id===id);if(!p)return;
 setVal("editId",p.id);
 ["title","category","type","areaName","meter","rooms","floor","year",
 "price","deposit","rent","features","description","ownerPhone","ownerAddress"]
 .forEach(k=>setVal(k,p[k]));
 document.getElementById("formTitle").textContent="ویرایش فایل";
 showTab("form");
}
async function deleteProperty(id){
 if(!confirm("این فایل حذف شود؟"))return;
 const {error}=await db.from("fileeno_properties").delete().eq("id",id);
 if(error){notify("حذف ناموفق: "+error.message);return}
 notify("فایل حذف شد");await loadProperties();
}
function renderFiles(){
 const q=val("search").toLowerCase();
 const cat=val("filterCategory");
 const list=properties.filter(p=>
  (!cat||p.category===cat)&&
  JSON.stringify(p).toLowerCase().includes(q)
 );
 document.getElementById("filesList").innerHTML=list.length?list.map(p=>`
 <div class="card">
  <h3>${safe(p.title)}</h3>
  <div class="muted">${safe(p.category)} | ${safe(p.type)} | ${safe(p.areaName)}</div>
  <div class="muted">${safe(p.meter)} متر | ${safe(p.rooms)} خواب | طبقه ${safe(p.floor)}</div>
  <div class="price">${money(p.price||p.deposit)}</div>
  <div class="muted">${safe(p.features)}</div>
  <div class="actions">
   <button class="light" onclick="editProperty('${p.id}')">ویرایش</button>
   <button class="light" onclick="shareProperty('${p.id}')">اشتراک</button>
   <button class="red" onclick="deleteProperty('${p.id}')">حذف</button>
  </div>
  <div class="private">
   🔒 مالک: ${safe(p.ownerPhone||"ثبت نشده")}<br>
   آدرس: ${safe(p.ownerAddress||"ثبت نشده")}
  </div>
 </div>`).join(""):'<div class="notice">هنوز فایلی ثبت نشده است.</div>';
}
function shareProperty(id){
 const p=properties.find(x=>x.id===id);if(!p)return;
 const text=[
  p.title,p.category,p.areaName,
  p.meter?p.meter+" متر":null,
  p.rooms?p.rooms+" خواب":null,
  p.features,p.description,
  p.price?"قیمت: "+money(p.price):null,
  p.deposit?"رهن: "+money(p.deposit):null,
  p.rent?"اجاره: "+money(p.rent):null
 ].filter(Boolean).join("\n");
 window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
}
async function loadCustomers(){
 const {data,error}=await db.from("fileeno_customers")
  .select("*").order("created_at",{ascending:false});
 if(error){notify("خطای مشتریان: "+error.message);return}
 customers=(data||[]).map(row=>({...row.data,id:row.id}));
 renderCustomers();
}
async function saveCustomer(){
 if(!currentUser)return;
 if(!val("customerName")){notify("نام مشتری را وارد کن");return}
 const id=val("customerEditId");
 const record={
  name:val("customerName"),phone:val("customerPhone"),
  type:val("customerType"),budget:val("customerBudget"),
  area:val("customerArea"),description:val("customerDescription")
 };
 let result=id?
  await db.from("fileeno_customers").update({data:record}).eq("id",id):
  await db.from("fileeno_customers").insert({user_id:currentUser.id,data:record});
 if(result.error){notify("ذخیره مشتری ناموفق: "+result.error.message);return}
 ["customerEditId","customerName","customerPhone","customerBudget",
 "customerArea","customerDescription"].forEach(k=>setVal(k,""));
 notify("مشتری ذخیره شد");await loadCustomers();
}
function renderCustomers(){
 document.getElementById("customersList").innerHTML=customers.map(c=>`
 <div class="card">
  <b>${safe(c.name)}</b>
  <div class="muted">${safe(c.phone)} | ${safe(c.type)} | ${safe(c.area)}</div>
  <div>${safe(c.description)}</div>
  <button class="light" onclick="editCustomer('${c.id}')">ویرایش</button>
  <button class="red" onclick="deleteCustomer('${c.id}')">حذف</button>
 </div>`).join("")||'<div class="notice">هنوز مشتری ثبت نشده است.</div>';
}
function editCustomer(id){
 const c=customers.find(x=>x.id===id);if(!c)return;
 setVal("customerEditId",c.id);setVal("customerName",c.name);
 setVal("customerPhone",c.phone);setVal("customerType",c.type);
 setVal("customerBudget",c.budget);setVal("customerArea",c.area);
 setVal("customerDescription",c.description);
 showTab("customers");
}
async function deleteCustomer(id){
 if(!confirm("مشتری حذف شود؟"))return;
 const {error}=await db.from("fileeno_customers").delete().eq("id",id);
 if(error){notify(error.message);return}
 await loadCustomers();notify("مشتری حذف شد");
}
function showTab(tab){
 ["files","form","customers"].forEach(name=>{
  document.getElementById(name+"Section").classList.toggle("hidden",name!==tab);
  document.getElementById("tab"+name[0].toUpperCase()+name.slice(1))
   .classList.toggle("active",name===tab);
 });
}
db.auth.getSession().then(async({data})=>{
 if(data.session){currentUser=data.session.user;await startApp()}
});
db.auth.onAuthStateChange(async(event,session)=>{
 if(event==="SIGNED_IN"&&session&&!currentUser){
  currentUser=session.user;await startApp();
 }
 if(event==="SIGNED_OUT"){
  currentUser=null;
  document.getElementById("application").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
 }
});
</script>
</body>
</html>
